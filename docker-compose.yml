services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labari
      POSTGRES_USER: labari
      POSTGRES_PASSWORD: labari
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labari"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: backend-fastapi
    environment:
      DATABASE_URL: postgresql://labari:labari@db:5432/labari
      JWT_SECRET: dev-only-secret-32-chars-minimum!!
      ENVIRONMENT: development
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
