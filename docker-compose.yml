services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labari
      POSTGRES_USER: labari
      POSTGRES_PASSWORD: labari
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labari"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: backend-fastapi
    environment:
      DATABASE_URL: postgresql://labari:labari@db:5432/labari
      JWT_SECRET: dev-secret-change-me
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pg_data:
