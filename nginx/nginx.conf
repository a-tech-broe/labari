server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Request size limit (covers API payloads and image uploads)
    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options            "SAMEORIGIN"           always;
    add_header X-Content-Type-Options     "nosniff"              always;
    add_header X-XSS-Protection           "1; mode=block"        always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    # Access log
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Proxy API calls to the FastAPI backend
    location /auth/ {
        proxy_pass         http://backend:8000/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /posts {
        proxy_pass         http://backend:8000/posts;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /search {
        proxy_pass         http://backend:8000/posts/search;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /images/ {
        proxy_pass         http://backend:8000/images/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # HTML: never cache (index.html bootstraps the SPA)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Hashed static assets: cache aggressively
    location ~* \.(js|css|woff2?|ico|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
