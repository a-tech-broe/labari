name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check infrastructure exists
        id: infra_check
        run: |
          BUCKET="${{ secrets.FRONTEND_BUCKET }}"
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -z "$BUCKET" ] || [ -z "$DIST_ID" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "FRONTEND_BUCKET or CLOUDFRONT_DISTRIBUTION_ID secret is not set — run the Terraform workflow first."
          elif aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "S3 bucket '$BUCKET' not found — run the Terraform workflow first to create it."
          fi

      - name: Sync to S3
        if: steps.infra_check.outputs.exists == 'true'
        run: |
          aws s3 sync out/ s3://${{ secrets.FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          aws s3 sync out/ s3://${{ secrets.FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        if: steps.infra_check.outputs.exists == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Skip notice
        if: steps.infra_check.outputs.exists == 'false'
        run: |
          echo "::warning::Frontend infrastructure does not exist yet. Run the Terraform workflow first, then re-run this workflow."
