name: Docker Deploy

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend-fastapi/**'
      - 'frontend/**'
      - 'nginx/**'
      - 'infrastructure-ec2/**'
      - 'ansible/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/docker-deploy.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/labari-backend
  NGINX_IMAGE:   ghcr.io/${{ github.repository }}/labari-nginx

jobs:

  # ── 1. Provision EC2 (only on dev, only when infra changed) ─────────────────
  provision:
    name: Terraform + Ansible Provision
    if: |
      github.ref == 'refs/heads/dev' &&
      (contains(github.event.head_commit.modified, 'infrastructure-ec2/') ||
       contains(github.event.head_commit.added, 'infrastructure-ec2/'))
    runs-on: ubuntu-latest
    environment: production
    outputs:
      public_ip: ${{ steps.tf_output.outputs.public_ip }}
    defaults:
      run:
        working-directory: infrastructure-ec2

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.x'
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=labari-ec2/terraform.tfstate" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_aws_region:      ${{ secrets.AWS_REGION }}
          TF_VAR_key_name:        ${{ secrets.EC2_KEY_NAME }}
          TF_VAR_domain_name:     ${{ secrets.DOMAIN_NAME }}
          TF_VAR_hosted_zone_id:  ${{ secrets.HOSTED_ZONE_ID }}

      - name: Get EC2 IP
        id: tf_output
        run: echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/labari.pem
          chmod 600 /tmp/labari.pem

      - name: Run Ansible provision playbook
        working-directory: ${{ github.workspace }}
        run: |
          pip install ansible --quiet
          cat > /tmp/inventory.ini <<EOF
          [labari]
          ${{ steps.tf_output.outputs.public_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=/tmp/labari.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF
          ansible-playbook ansible/provision.yml \
            -i /tmp/inventory.ini \
            -e "ghcr_token=${{ secrets.GHCR_TOKEN }}" \
            -e "ghcr_user=${{ github.actor }}" \
            -e "github_repository=${{ github.repository }}" \
            -e "image_tag=latest" \
            -e "db_password=${{ secrets.DB_PASSWORD }}" \
            -e "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -e "aws_region=${{ secrets.AWS_REGION }}" \
            -e "images_bucket=${{ secrets.IMAGES_BUCKET }}"

  # ── 2. Build & push Docker images (on any matching push) ────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend-fastapi
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push nginx (includes frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:latest
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 3. Deploy to EC2 (only on main, after build) ────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Get EC2 IP from Terraform state
        id: ec2_ip
        run: |
          pip install --quiet awscli
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=labari-prod" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "::error::No running labari-prod instance found. Push to dev first to provision."
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/labari.pem
          chmod 600 /tmp/labari.pem

      - name: Run Ansible deploy playbook
        run: |
          pip install ansible --quiet
          cat > /tmp/inventory.ini <<EOF
          [labari]
          ${{ steps.ec2_ip.outputs.ip }} ansible_user=ubuntu ansible_ssh_private_key_file=/tmp/labari.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF
          ansible-playbook ansible/deploy.yml \
            -i /tmp/inventory.ini \
            -e "ghcr_token=${{ secrets.GHCR_TOKEN }}" \
            -e "ghcr_user=${{ github.actor }}" \
            -e "github_repository=${{ github.repository }}" \
            -e "image_tag=${{ github.sha }}" \
            -e "db_password=${{ secrets.DB_PASSWORD }}" \
            -e "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -e "aws_region=${{ secrets.AWS_REGION }}" \
            -e "images_bucket=${{ secrets.IMAGES_BUCKET }}"
