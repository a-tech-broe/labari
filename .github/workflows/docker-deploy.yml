name: Docker Deploy

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend-fastapi/**'
      - 'frontend/**'
      - 'nginx/**'
      - 'infrastructure-ec2/**'
      - 'ansible/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/docker-deploy.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/labari-backend
  NGINX_IMAGE:   ${{ secrets.DOCKERHUB_USERNAME }}/labari-nginx

jobs:

  # ── 0. Detect which paths changed ───────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      infra:   ${{ github.event_name == 'workflow_dispatch' && 'false' || steps.filter.outputs.infra }}
      app:     ${{ github.event_name == 'workflow_dispatch' && 'true'  || steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            infra:
              - 'infrastructure-ec2/**'
            app:
              - 'backend-fastapi/**'
              - 'frontend/**'
              - 'nginx/**'
              - 'ansible/**'
              - 'docker-compose.prod.yml'

  # ── 1. Provision EC2 (only on dev when infra-ec2 files changed) ─────────────
  provision:
    name: Terraform + Ansible Provision
    needs: changes
    if: |
      github.ref == 'refs/heads/dev' &&
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      public_ip: ${{ steps.tf_output.outputs.public_ip }}
    defaults:
      run:
        working-directory: infrastructure-ec2

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.x'
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=labari-ec2/terraform.tfstate" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_aws_region:        ${{ secrets.AWS_REGION }}
          TF_VAR_key_name:          ${{ secrets.EC2_KEY_NAME }}
          TF_VAR_domain_name:       ${{ secrets.DOMAIN_NAME }}
          TF_VAR_hosted_zone_id:    ${{ secrets.HOSTED_ZONE_ID }}
          TF_VAR_eip_allocation_id: ${{ secrets.EIP_ALLOCATION_ID }}

      - name: Get EC2 IP
        id: tf_output
        run: |
          IP=$(terraform output -raw public_ip)
          if [ -z "$IP" ]; then
            echo "::error::Terraform output 'public_ip' is empty — apply may have failed"
            exit 1
          fi
          echo "public_ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Write SSH key
        run: |
          KEY_FILE=$(mktemp)
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Run Ansible provision playbook
        working-directory: ${{ github.workspace }}
        run: |
          pip install ansible --quiet
          cat > /tmp/inventory.ini <<EOF
          [labari]
          ${{ steps.tf_output.outputs.public_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=$KEY_FILE ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF
          ansible-playbook ansible/provision.yml \
            -i /tmp/inventory.ini \
            -e "dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            -e "dockerhub_token=${{ secrets.DOCKERHUB_TOKEN }}" \
            -e "image_tag=latest" \
            -e "db_password=${{ secrets.DB_PASSWORD }}" \
            -e "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -e "aws_region=${{ secrets.AWS_REGION }}" \
            -e "domain_name=${{ secrets.DOMAIN_NAME }}" \
            -e "images_bucket=${{ secrets.IMAGES_BUCKET }}"

      - name: Clean up SSH key
        if: always()
        run: rm -f "$KEY_FILE"

  # ── 2. Build & push Docker images (only when app files changed) ─────────────
  build:
    name: Build & Push Images
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend-fastapi
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push nginx (includes frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:latest
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 3. Deploy to EC2 (only on main, after build succeeds) ───────────────────
  deploy:
    name: Deploy to EC2
    needs: [changes, build]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.app == 'true' &&
      (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Get EC2 IP
        id: ec2_ip
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=labari-prod" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "::error::No running labari-prod instance found. Push to dev first to provision."
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Write SSH key
        run: |
          KEY_FILE=$(mktemp)
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Run Ansible deploy playbook
        run: |
          pip install ansible --quiet
          cat > /tmp/inventory.ini <<EOF
          [labari]
          ${{ steps.ec2_ip.outputs.ip }} ansible_user=ubuntu ansible_ssh_private_key_file=$KEY_FILE ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF
          ansible-playbook ansible/deploy.yml \
            -i /tmp/inventory.ini \
            -e "dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            -e "dockerhub_token=${{ secrets.DOCKERHUB_TOKEN }}" \
            -e "image_tag=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}" \
            -e "db_password=${{ secrets.DB_PASSWORD }}" \
            -e "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -e "aws_region=${{ secrets.AWS_REGION }}" \
            -e "domain_name=${{ secrets.DOMAIN_NAME }}" \
            -e "images_bucket=${{ secrets.IMAGES_BUCKET }}"

      - name: Clean up SSH key
        if: always()
        run: rm -f "$KEY_FILE"
