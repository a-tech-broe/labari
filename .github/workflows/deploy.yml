name: CI / CD

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'backend/**'

permissions:
  contents: read
  pull-requests: write

jobs:

  # ── 1. Detect what changed ──────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      infra:    ${{ steps.filter.outputs.infra }}
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infrastructure/**'
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  # ── 2. Backend tests (runs in parallel with nothing — first gate) ───────────
  test:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest backend/tests/ -v --tb=short

  # ── 3. Terraform plan / apply (waits for tests) ─────────────────────────────
  terraform:
    name: Terraform
    needs: [changes, test]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.infra == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=()
          [ -z "$TF_STATE_BUCKET" ] && missing+=("TF_STATE_BUCKET")
          [ -z "$TF_LOCK_TABLE" ]   && missing+=("TF_LOCK_TABLE")
          [ -z "$AWS_REGION" ]      && missing+=("AWS_REGION")
          [ -z "$DOMAIN_NAME" ]     && missing+=("DOMAIN_NAME")
          [ -z "$ALERT_EMAIL" ]     && missing+=("ALERT_EMAIL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE:   ${{ secrets.TF_LOCK_TABLE }}
          AWS_REGION:      ${{ secrets.AWS_REGION }}
          DOMAIN_NAME:     ${{ secrets.DOMAIN_NAME }}
          ALERT_EMAIL:     ${{ secrets.ALERT_EMAIL }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Lambda zip
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist/package
          pip install -r backend/requirements.txt -t dist/package/ --quiet
          cp -r backend/handler.py backend/handlers backend/shared dist/package/
          cd dist/package && zip -r ../../dist/lambda.zip . \
            -x "**/__pycache__/*" -x "*.pyc" -x "*.dist-info/*"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color
        env:
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_aws_region:  ${{ secrets.AWS_REGION }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `${{ steps.plan.outputs.stdout }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan 📋\n\`\`\`\n${plan}\n\`\`\``
            });

      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_aws_region:  ${{ secrets.AWS_REGION }}

  # ── 4a. Deploy backend (waits for tests + terraform) ────────────────────────
  deploy-backend:
    name: Deploy Backend
    needs: [changes, test, terraform]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.backend == 'true' &&
      needs.test.result == 'success' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Check Lambda exists
        id: lambda_check
        run: |
          FUNCTION_NAME="${{ secrets.LAMBDA_FUNCTION_NAME }}"
          if aws lambda get-function --function-name "$FUNCTION_NAME" \
              --query 'Configuration.FunctionName' --output text 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Lambda '$FUNCTION_NAME' not found — run terraform apply first."
          fi

      - name: Build Lambda package
        if: steps.lambda_check.outputs.exists == 'true'
        run: |
          mkdir -p dist/package
          pip install -r backend/requirements.txt -t dist/package/ --quiet
          cp -r backend/handler.py backend/handlers backend/shared dist/package/
          cd dist/package && zip -r ../../dist/lambda.zip . \
            -x "**/__pycache__/*" -x "*.pyc" -x "*.dist-info/*"

      - name: Deploy Lambda
        if: steps.lambda_check.outputs.exists == 'true'
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://dist/lambda.zip \
            --architectures arm64 \
            --query 'FunctionArn' --output text

      - name: Wait for update
        if: steps.lambda_check.outputs.exists == 'true'
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Skip notice
        if: steps.lambda_check.outputs.exists == 'false'
        run: echo "::warning::Lambda not found. Run the Terraform workflow first."

  # ── 4b. Deploy frontend (waits for terraform; runs in parallel with backend) ─
  deploy-frontend:
    name: Deploy Frontend
    needs: [changes, terraform]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true') &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Resolve deployment targets
        id: targets
        run: |
          # Use secrets if set, otherwise derive from AWS
          BUCKET="${{ secrets.FRONTEND_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            BUCKET="labari-prod-frontend-${ACCOUNT_ID}"
            echo "Derived bucket: $BUCKET"
          fi

          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -z "$DIST_ID" ]; then
            DOMAIN="${{ secrets.DOMAIN_NAME }}"
            DIST_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?contains(Aliases.Items, '${DOMAIN}')].Id" \
              --output text)
            echo "Derived distribution: $DIST_ID"
          fi

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null && [ -n "$DIST_ID" ]; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "bucket=$BUCKET"   >> "$GITHUB_OUTPUT"
            echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Infrastructure not ready (bucket=$BUCKET, dist=$DIST_ID). Run Terraform first."
          fi

      - name: Sync to S3
        if: steps.targets.outputs.exists == 'true'
        run: |
          aws s3 sync out/ s3://${{ steps.targets.outputs.bucket }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          aws s3 sync out/ s3://${{ steps.targets.outputs.bucket }}/ \
            --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        if: steps.targets.outputs.exists == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.targets.outputs.dist_id }} \
            --paths "/*"
