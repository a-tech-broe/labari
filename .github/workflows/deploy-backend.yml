name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest backend/tests/ -v --tb=short
        working-directory: .

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check Lambda exists
        id: lambda_check
        run: |
          FUNCTION_NAME="${{ secrets.LAMBDA_FUNCTION_NAME }}"
          if aws lambda get-function --function-name "$FUNCTION_NAME" \
              --query 'Configuration.FunctionName' --output text 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Lambda '$FUNCTION_NAME' not found — run terraform apply first to create it."
          fi

      - name: Build Lambda package
        if: steps.lambda_check.outputs.exists == 'true'
        run: |
          mkdir -p dist/package
          pip install -r backend/requirements.txt -t dist/package/ --quiet
          cp -r backend/handler.py backend/handlers backend/shared dist/package/
          cd dist/package && zip -r ../../dist/lambda.zip . \
            -x "**/__pycache__/*" -x "*.pyc" -x "*.dist-info/*"

      - name: Deploy Lambda
        if: steps.lambda_check.outputs.exists == 'true'
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://dist/lambda.zip \
            --architectures arm64 \
            --query 'FunctionArn' \
            --output text

      - name: Wait for update
        if: steps.lambda_check.outputs.exists == 'true'
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Skip notice
        if: steps.lambda_check.outputs.exists == 'false'
        run: |
          echo "::warning::Lambda function does not exist yet. Run the Terraform workflow first, then re-run this workflow."
