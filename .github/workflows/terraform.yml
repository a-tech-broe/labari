name: Terraform

on:
  push:
    branches: [main]
    paths: ['infrastructure/**', 'backend/**']
  pull_request:
    branches: [main]
    paths: ['infrastructure/**', 'backend/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Plan / Apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infrastructure

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check required secrets
        run: |
          missing=()
          [ -z "$TF_STATE_BUCKET" ] && missing+=("TF_STATE_BUCKET")
          [ -z "$TF_LOCK_TABLE" ]   && missing+=("TF_LOCK_TABLE")
          [ -z "$AWS_REGION" ]      && missing+=("AWS_REGION")
          [ -z "$DOMAIN_NAME" ]     && missing+=("DOMAIN_NAME")
          [ -z "$ALERT_EMAIL" ]     && missing+=("ALERT_EMAIL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets → Actions before running this workflow."
            exit 1
          fi
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

      # Build the Lambda zip so Terraform can read it during plan.
      # The backend deploy workflow also builds and deploys it, but Terraform
      # needs the file to exist to create/update the aws_lambda_function resource.
      - name: Build Lambda package
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist/packages
          pip install -r backend/requirements.txt -t dist/packages/ --quiet
          cp -r backend/handler.py backend/handlers backend/shared dist/packages/
          cd dist/packages && zip -r ../../dist/lambda.zip . \
            -x "**/__pycache__/*" -x "*.pyc" -x "*.dist-info/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Format
        run: terraform fmt -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color
        env:
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
