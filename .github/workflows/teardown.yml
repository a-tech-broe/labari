name: Teardown

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm teardown of all AWS resources'
        required: true
      delete_dockerhub:
        description: 'Also delete Docker Hub repositories?'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  teardown:
    name: Destroy AWS Resources
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify confirmation
        if: inputs.confirm != 'destroy'
        run: |
          echo "::error::Confirmation input must be exactly 'destroy'. Got: '${{ inputs.confirm }}'"
          exit 1

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.x'
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infrastructure-ec2
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=labari-ec2/terraform.tfstate" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -input=false

      - name: Terraform Destroy
        working-directory: infrastructure-ec2
        run: terraform destroy -auto-approve
        env:
          TF_VAR_aws_region:        ${{ secrets.AWS_REGION }}
          TF_VAR_key_name:          ${{ secrets.EC2_KEY_NAME }}
          TF_VAR_domain_name:       ${{ secrets.DOMAIN_NAME }}
          TF_VAR_hosted_zone_id:    ${{ secrets.HOSTED_ZONE_ID }}
          TF_VAR_eip_allocation_id: ${{ secrets.EIP_ALLOCATION_ID }}

      - name: Delete Docker Hub repositories
        if: inputs.delete_dockerhub == true
        run: |
          HUB_JWT=$(curl -sf -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"${{ secrets.DOCKERHUB_USERNAME }}","password":"${{ secrets.DOCKERHUB_TOKEN }}"}' \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)

          for repo in labari-backend labari-nginx; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -X DELETE \
              "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/$repo/" \
              -H "Authorization: JWT $HUB_JWT" || true)
            echo "$repo → HTTP $STATUS"
          done

      - name: Reminder — release Elastic IP
        if: always()
        run: |
          echo "::notice::Elastic IP was disassociated but NOT released. To stop charges, run:"
          echo "::notice::aws ec2 release-address --allocation-id ${{ secrets.EIP_ALLOCATION_ID }} --region ${{ secrets.AWS_REGION }}"
