name: Teardown Serverless Stack

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm — this permanently deletes Lambda, DynamoDB, S3, CloudFront, and ACM resources'
        required: true
      apply_ec2_dns:
        description: 'Re-point Route 53 to EC2 after destroy? (yes/no)'
        required: true
        default: 'yes'

permissions:
  contents: read

jobs:
  teardown:
    name: Destroy Serverless Infrastructure
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Validate confirmation
        if: github.event.inputs.confirm != 'destroy'
        run: |
          echo "::error::Confirmation input must be exactly 'destroy'. Got: '${{ github.event.inputs.confirm }}'"
          exit 1

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.x'
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Enable force_destroy on S3 buckets
        run: |
          terraform apply -auto-approve \
            -target=module.storage.aws_s3_bucket.frontend \
            -target=module.storage.aws_s3_bucket.images
        env:
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_aws_region:  ${{ secrets.AWS_REGION }}

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_aws_region:  ${{ secrets.AWS_REGION }}

  point-dns-to-ec2:
    name: Re-point Route 53 to EC2
    needs: teardown
    if: github.event.inputs.apply_ec2_dns == 'yes'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infrastructure-ec2

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.x'
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=labari-ec2/terraform.tfstate" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_aws_region:        ${{ secrets.AWS_REGION }}
          TF_VAR_key_name:          ${{ secrets.EC2_KEY_NAME }}
          TF_VAR_domain_name:       ${{ secrets.DOMAIN_NAME }}
          TF_VAR_hosted_zone_id:    ${{ secrets.HOSTED_ZONE_ID }}
          TF_VAR_eip_allocation_id: ${{ secrets.EIP_ALLOCATION_ID }}
