services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labari
      POSTGRES_USER: labari
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labari"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME}/labari-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://labari:${DB_PASSWORD}@db:5432/labari
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: '["https://${DOMAIN_NAME}","https://www.${DOMAIN_NAME}"]'
      AWS_REGION: ${AWS_REGION:-us-east-1}
      IMAGES_BUCKET: ${IMAGES_BUCKET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: ${DOCKERHUB_USERNAME}/labari-nginx:${IMAGE_TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
