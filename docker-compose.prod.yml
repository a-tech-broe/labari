services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labari
      POSTGRES_USER: labari
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labari"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME}/labari-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://labari:${DB_PASSWORD}@db:5432/labari
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      IMAGES_BUCKET: ${IMAGES_BUCKET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: ${DOCKERHUB_USERNAME}/labari-nginx:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pg_data:
