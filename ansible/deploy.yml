---
- name: Deploy Labari to EC2
  hosts: labari
  become: true
  gather_facts: false

  vars:
    compose_dir: /opt/labari

  tasks:
    - name: Copy updated docker-compose.prod.yml
      copy:
        src: ../docker-compose.prod.yml
        dest: "{{ compose_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu

    - name: Login to GHCR
      shell: >
        echo "{{ ghcr_token }}" |
        docker login ghcr.io -u "{{ ghcr_user }}" --password-stdin
      no_log: true

    - name: Pull updated images
      shell: docker compose -f {{ compose_dir }}/docker-compose.yml pull
      environment:
        GITHUB_REPOSITORY: "{{ github_repository }}"
        IMAGE_TAG: "{{ image_tag }}"
        DB_PASSWORD: "{{ db_password }}"
        JWT_SECRET: "{{ jwt_secret }}"
        AWS_REGION: "{{ aws_region | default('us-east-1') }}"
        IMAGES_BUCKET: "{{ images_bucket | default('') }}"

    - name: Restart application stack
      shell: docker compose -f {{ compose_dir }}/docker-compose.yml up -d --remove-orphans
      environment:
        GITHUB_REPOSITORY: "{{ github_repository }}"
        IMAGE_TAG: "{{ image_tag }}"
        DB_PASSWORD: "{{ db_password }}"
        JWT_SECRET: "{{ jwt_secret }}"
        AWS_REGION: "{{ aws_region | default('us-east-1') }}"
        IMAGES_BUCKET: "{{ images_bucket | default('') }}"

    - name: Verify stack is healthy
      shell: docker compose -f {{ compose_dir }}/docker-compose.yml ps
      register: compose_status

    - name: Show stack status
      debug:
        var: compose_status.stdout_lines
